<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masal Kandili: Türk Masalları Derlemesi</title>
<style>
  :root{
    --zemin:#2a1745; --kart:#3a2160; --cizgi:#5b3d8a;
    --yazi:#f5efe0; --altin:#f2c14e; --boyut:1.15rem;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--zemin);color:var(--yazi);
       font-family:Georgia,"Palatino Linotype",serif;line-height:1.7}
  .duzen{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

  /* Sol menü */
  nav{background:var(--kart);border-right:2px solid var(--cizgi);padding:1.5rem 1rem}
  nav h1{color:var(--altin);font-size:1.5rem;margin:0 0 1rem}
  #ara{width:100%;padding:.6rem;border-radius:6px;border:1px solid var(--cizgi);
       background:var(--zemin);color:var(--yazi);font:inherit;font-size:1rem}
  #liste{list-style:none;padding:0;margin:1rem 0 0}
  #liste button{width:100%;text-align:left;padding:.7rem .8rem;margin-bottom:.3rem;
       background:none;border:0;border-left:4px solid transparent;color:var(--yazi);
       font:inherit;font-size:1rem;cursor:pointer}
  #liste button:hover{background:var(--zemin)}
  #liste button.secili{border-left-color:var(--altin);background:var(--zemin);color:var(--altin)}
  #liste small{display:block;opacity:.75;font-family:"Segoe UI",system-ui,sans-serif}

  /* Okuma alanı */
  main{padding:2rem 1.5rem;max-width:44rem;margin:0 auto}
  .araclar{display:flex;gap:.5rem;font-family:"Segoe UI",system-ui,sans-serif;margin-bottom:1.5rem}
  .araclar button{padding:.4rem .9rem;background:none;color:var(--altin);
       border:1px solid var(--altin);border-radius:6px;cursor:pointer;font:inherit}
  .araclar button:hover{background:var(--altin);color:var(--zemin)}
  h2{color:var(--altin);font-size:2rem;margin:0 0 .2rem}
  .tur{font-family:"Segoe UI",system-ui,sans-serif;opacity:.8;margin-bottom:1.5rem}
  #metin{font-size:var(--boyut)}
  #bos{display:none;opacity:.8}

  /* Telefon */
  @media (max-width:760px){
    .duzen{grid-template-columns:1fr}
    nav{border-right:0;border-bottom:2px solid var(--cizgi)}
    #liste{max-height:12rem;overflow:auto}
  }
</style>
</head>
<body>
<div class="duzen">
  <nav aria-label="Masal listesi">
    <h1>Masal Kandili</h1>
    <input id="ara" type="search" placeholder="Masal ara…" aria-label="Masal ara">
    <ul id="liste"></ul>
    <p id="bos">Aramana uyan masal yok.</p>
  </nav>
  <main>
    <div class="araclar">
      <button id="kucult" aria-label="Yazıyı küçült">A−</button>
      <button id="buyut" aria-label="Yazıyı büyüt">A+</button>
    </div>
    <h2 id="baslik"></h2>
    <div class="tur" id="tur"></div>
    <div id="metin"></div>
  </main>
</div>

<script>
  // Masalları bir dizi olarak tutuyoruz. Metinleri sonra dolduracağız.
  const masallar = [
    {baslik:"Keloğlan ve Div", tur:"Kahramanlık masalı", metin:"Masal metni buraya gelecek."},
    {baslik:"Nasreddin Hoca Fıkraları", tur:"Fıkra", metin:"Masal metni buraya gelecek."},
    {baslik:"Tepegöz", tur:"Dede Korkut destanı", metin:"Masal metni buraya gelecek."},
    {baslik:"Tahir ile Zühre", tur:"Halk hikâyesi", metin:"Masal metni buraya gelecek."},
    {baslik:"Köroğlu", tur:"Halk hikâyesi", metin:"Masal metni buraya gelecek."},
    {baslik:"Zümrüdüanka", tur:"Fantastik masal", metin:"Masal metni buraya gelecek."},
    {baslik:"Altın Saçlı Kız", tur:"Peri masalı", metin:"Masal metni buraya gelecek."},
    {baslik:"Karagöz ile Hacivat", tur:"Gölge oyunu", metin:"Masal metni buraya gelecek."}
  ];

  const liste = document.getElementById("liste");
  const ara = document.getElementById("ara");
  const bos = document.getElementById("bos");
  let seciliIndeks = 0;
  let boyut = 1.15; // rem

  // 1) Listeyi çiz (arama sözcüğüne göre süzerek)
  function listeyiCiz(){
    const sozcuk = ara.value.trim().toLocaleLowerCase("tr");
    liste.innerHTML = "";
    let say = 0;
    masallar.forEach((m, i) => {
      if(!m.baslik.toLocaleLowerCase("tr").includes(sozcuk)) return;
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.innerHTML = m.baslik + "<small>" + m.tur + "</small>";
      if(i === seciliIndeks) b.className = "secili";
      b.onclick = () => masalAc(i);
      li.appendChild(b);
      liste.appendChild(li);
      say++;
    });
    bos.style.display = say ? "none" : "block";
  }

  // 2) Seçilen masalı okuma alanında göster
  function masalAc(i){
    seciliIndeks = i;
    document.getElementById("baslik").textContent = masallar[i].baslik;
    document.getElementById("tur").textContent = masallar[i].tur;
    document.getElementById("metin").textContent = masallar[i].metin;
    listeyiCiz();
  }

  // 3) Yazı boyutu ayarı
  function boyutDegistir(fark){
    boyut = Math.min(1.8, Math.max(0.9, boyut + fark));
    document.documentElement.style.setProperty("--boyut", boyut + "rem");
  }
  document.getElementById("buyut").onclick = () => boyutDegistir(0.1);
  document.getElementById("kucult").onclick = () => boyutDegistir(-0.1);
  ara.oninput = listeyiCiz;

  masalAc(0);
</script>
</body>
</html>
